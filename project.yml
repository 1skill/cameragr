name: cameragr
options:
  bundleIdPrefix: com.oneskill
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  cameragr:
    type: application
    platform: iOS
    sources:
      - cameragr
      - path: PeliWidgets/WidgetViews.swift
    dependencies:
      - target: PeliWidgets
    info:
      path: Config/cameragr-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.oneskill.cameragr
            CFBundleURLSchemes: [peli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Peli
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: 用于取景和拍照。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于把拍好的照片存入 Peli 相簿，以及导入照片套用胶片效果。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于把拍好的照片存入相册。
  PeliWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PeliWidgets
      - path: cameragr/Model/Film.swift
      - path: cameragr/UI/Canister.swift
      - path: cameragr/Resources/Films/films.json
    info:
      path: Config/PeliWidgets-Info.plist
      properties:
        CFBundleDisplayName: Peli
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr.widgets
        TARGETED_DEVICE_FAMILY: "1"
