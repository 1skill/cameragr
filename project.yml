name: cameragr
options:
  bundleIdPrefix: com.oneskill
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Core Image kernels written in Metal (Render/*.ci.metal)
    MTL_COMPILER_FLAGS: "-fcikernel"
    MTLLINKER_FLAGS: "-cikernel"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: 4R43P99RCX
    CODE_SIGN_STYLE: Automatic
    # PNGs go in as saved (already optimised); Xcode's own pass made them a
    # third bigger (11/25: 14 MB of PNGs became 19 MB). Same pixels either way.
    COMPRESS_PNG_FILES: NO
    STRIP_PNG_TEXT: NO
    CURRENT_PROJECT_VERSION: "97"
targets:
  cameragr:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - cameragrTests
      # Local products for the simulator and tests until App Store Connect has them.
      storeKitConfiguration: Config/Koco.storekit
    sources:
      - cameragr
      - Shared
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: PeliWidgets/WidgetViews.swift
      - path: PeliWidgets/widget_texture.jpg
      - path: PeliWidgets/widget_plate.png
      - path: PeliWidgets/widget_stripe.png
    dependencies:
      - target: PeliWidgets
      - target: PeliCapture
    # The community's sign-in (C2b): com.apple.developer.applesignin, carried
    # by an explicit development profile made for this App ID and the Duo
    # ("Koco Dev Sign in with Apple", user agreed 11/25); the extensions keep
    # automatic signing.
    entitlements:
      path: Config/cameragr.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Config/cameragr-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the system's own encryption (HTTPS, StoreKit): exempt, so TestFlight doesn't ask each build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.oneskill.cameragr
            CFBundleURLSchemes: [peli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Koco
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_NSCameraUsageDescription: Koco uses the camera to frame and take pictures.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Koco saves your pictures to a Koco album and lets you import photos to try a film on them.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Koco saves your pictures to Photos.
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: Koco Dev Sign in with Apple
        # App Store builds (user agreed 11/25): explicit profiles, Sign in with Apple included.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Koco App Store
  cameragrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - cameragrUITests
    dependencies:
      - target: cameragr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr.uitests
        TEST_TARGET_NAME: cameragr
    scheme:
      testTargets:
        - cameragrUITests
  cameragrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - cameragrTests
      - path: Config/Koco.storekit
        buildPhase: resources
    dependencies:
      - target: cameragr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr.tests
        TARGETED_DEVICE_FAMILY: "1"
  PeliWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PeliWidgets
      - Shared
      - path: Config/Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: cameragr/Model/Film.swift
      - path: cameragr/UI/Canister.swift
      - path: cameragr/Resources/Films/films.json
      - path: cameragr/Resources/Rolls
    info:
      path: Config/PeliWidgets-Info.plist
      properties:
        CFBundleDisplayName: Koco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr.widgets
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Koco Widgets App Store
  PeliCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - PeliCapture
      - Shared
      - path: Config/Privacy/Capture/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: cameragr
        excludes:
          - "App/**"
          - "UI/WidgetGallery.swift"
          - "Resources/Assets.xcassets"
          - "Resources/Samples/**"
          # The camera bag's pages never open on the Lock Screen (it asks to
          # unlock and opens the app there): their pictures stay out.
          - "Resources/library_bag.jpg"
          - "Resources/kit_spread.jpg"
          - "Resources/book_spread.jpg"
          - "Resources/kit_board.jpg"
          - "Resources/book_board.jpg"
          - "Resources/index_tab.png"
          - "Resources/letter_base.jpg"
          - "Resources/share_tray.jpg"
          - "Resources/nav_*.png"
          # The community and the rest of the bag can't open there either
          # (11/25: they had crept in, ~10 MB; a list of what stays would be safer).
          - "Resources/club_*"
          - "Resources/post_*"
          - "Resources/rail_*"
          - "Resources/badge_*"
          - "Resources/language_card.png"
          - "Resources/card_slot.png"
          - "Resources/roll_stub.png"
          - "Resources/next_ribbon.png"
          - "Resources/bag_clasp.png"
          - "Resources/sleeve_row.jpg"
    info:
      path: Config/PeliCapture-Info.plist
      properties:
        CFBundleDisplayName: Koco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
        # The Lock Screen is upright; asking for anything else makes the system
        # turn the camera after it has appeared. The body is laid out on its side.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Koco uses the camera to frame and take pictures.
        NSPhotoLibraryUsageDescription: Koco saves your pictures to a Koco album and lets you import photos to try a film on them.
        NSPhotoLibraryAddUsageDescription: Koco saves your pictures to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneskill.cameragr.capture
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Koco Capture App Store
